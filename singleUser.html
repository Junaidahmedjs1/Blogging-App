<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single User Blog</title>
     <!-- Bootstrap 5 CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="./index.html">ThinkSpot</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Conditional rendering based on login state -->
                    <li class="nav-item" id="login-btn">
                        <a class="nav-link" href="#">Login</a>
                    </li>
                    <div id="login-user" class="d-none d-flex gap-5">
                        <li class="nav-item d-flex gap-5" id="profile-btn ">
                            <img id="user-profile-img" width="35" src="" alt="Profile" class="rounded-circle">
                            <p class="fw-bold mt-2" id="user-profile-name" ></p>
                        </li>
                        <li class="nav-item" id="login-btn">
                            <a class="nav-link fw-bold" href="./dashboard.html">Dashboard</a>
                        </li>
                        <li class="nav-item" id="logout-btn">
                            <a class="nav-link" href="./login.html">Logout</a>
                        </li>
                    </div>
                </ul>
            </div>
        </div>
    </nav>

        
      

    <!-- User Posts -->
    <div class="container mt-5">
        <h4 class="text-center fw-bold fs-2">User's Blogs</h4>
        <div id="user-posts-container">
            <p class="text-center text-muted">Loading posts...</p>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
<script type="module" src="./Scripts/singleUser.js"></script>
</body>
</html>
