<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <!-- Bootstrap 5 CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center">Dashboard - Add Card</h2>

        <!-- Input Form -->
         <form id="form">
        <div class="card p-4 shadow-lg">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" placeholder="Enter Title" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="3" placeholder="Enter Description" required></textarea>
            </div>
            <div>
                <button class="btn btn-primary mt-2"  id="upload_widget">Upload files</button>
                </div>
            <button class="btn btn-primary mt-3"  id="addCard">Add Card</button>
        </div>

       
    </div>
</form>
    
<script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
<script type="module" src="./Scripts/dashboard.js"></script>
</body>
</html>
